<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1020" />
    <title>Homework</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">School</p>
        <h1>Homework</h1>
        <p class="subtitle">Upcoming assignments and assessments — check off when done</p>
        <p class="tz" id="tz-label">Timezone: HKT / Asia/Hong_Kong</p>
      </header>

      <section class="filters" aria-label="Filter assignments" id="filters"></section>

      <section class="panel" aria-labelledby="assignments-heading">
        <div class="panel-head">
          <h2 id="assignments-heading">Assignments</h2>
          <span class="count" id="list-count"></span>
        </div>
        <div id="assignment-list" class="list" role="list"></div>
        <p class="empty" id="list-empty" hidden>No assignments match this filter.</p>
      </section>

      <footer class="footer">
        <p>
          Check the box to mark finished — done items stay listed (strikethrough). Marks save in this browser.
        </p>
        <p><a href="/">← All apps</a></p>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
