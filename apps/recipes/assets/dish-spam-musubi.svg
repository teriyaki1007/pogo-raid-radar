<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Spam musubi">
  <!-- rectangular musubi — UNIQUE shape vs bowls -->
  <g transform="translate(40,35)">
    <!-- nori sides -->
    <rect x="8" y="25" width="18" height="110" rx="3" fill="#1a1917"/>
    <rect x="214" y="25" width="18" height="110" rx="3" fill="#1a1917"/>
    <!-- rice block -->
    <rect x="18" y="45" width="204" height="85" rx="6" fill="#faf6ef" stroke="#e4d9c8" stroke-width="3"/>
    <g fill="#e4d9c8">
      <circle cx="50" cy="70" r="3"/><circle cx="80" cy="65" r="2.5"/><circle cx="110" cy="75" r="3"/>
      <circle cx="145" cy="68" r="2.8"/><circle cx="175" cy="78" r="2.5"/><circle cx="200" cy="70" r="3"/>
      <circle cx="60" cy="100" r="2.5"/><circle cx="95" cy="105" r="3"/><circle cx="130" cy="98" r="2.5"/>
      <circle cx="165" cy="108" r="2.8"/><circle cx="190" cy="100" r="2.5"/>
    </g>
    <!-- pink glazed spam top -->
    <rect x="28" y="10" width="184" height="50" rx="6" fill="#e28a6a" stroke="#a84830" stroke-width="3"/>
    <rect x="40" y="18" width="160" height="14" rx="4" fill="#ef9a78" opacity="0.65"/>
    <!-- dark nori belt -->
    <rect x="0" y="38" width="240" height="28" rx="3" fill="#2c2a26"/>
    <rect x="0" y="42" width="240" height="6" fill="#1a1917" opacity="0.5"/>
    <!-- furikake -->
    <g fill="#3d6b5a">
      <circle cx="55" cy="22" r="3.5"/><circle cx="90" cy="18" r="3"/><circle cx="125" cy="24" r="3.5"/>
      <circle cx="160" cy="17" r="3"/><circle cx="190" cy="22" r="3.2"/>
    </g>
    <g fill="#c45c3e">
      <circle cx="70" cy="28" r="2.5"/><circle cx="140" cy="14" r="2.2"/><circle cx="175" cy="26" r="2.5"/>
    </g>
  </g>
</svg>
