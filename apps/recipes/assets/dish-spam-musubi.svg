<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Spam musubi plating">
  <rect width="320" height="200" rx="24" fill="#f7f1e8"/>
  <!-- board / plate -->
  <rect x="48" y="128" width="224" height="36" rx="10" fill="#e8dcc8" stroke="#d0c0a8" stroke-width="2"/>
  <ellipse cx="160" cy="130" rx="108" ry="14" fill="#f0e6d4"/>
  <!-- musubi 1 (front-left) -->
  <g transform="translate(72,78)">
    <!-- nori wrap sides -->
    <rect x="8" y="18" width="10" height="52" rx="2" fill="#2c2a26"/>
    <rect x="70" y="18" width="10" height="52" rx="2" fill="#2c2a26"/>
    <!-- rice block -->
    <rect x="10" y="28" width="68" height="36" rx="4" fill="#f7f1e8" stroke="#e4d9c8" stroke-width="1.5"/>
    <g fill="#e4d9c8" opacity="0.7">
      <circle cx="24" cy="40" r="1.4"/><circle cx="36" cy="36" r="1.2"/><circle cx="48" cy="42" r="1.3"/>
      <circle cx="58" cy="38" r="1.2"/><circle cx="30" cy="50" r="1.1"/><circle cx="52" cy="52" r="1.2"/>
    </g>
    <!-- glazed spam -->
    <rect x="14" y="12" width="60" height="22" rx="3" fill="#c45c3e" stroke="#a84830" stroke-width="1.5"/>
    <rect x="18" y="16" width="52" height="6" rx="2" fill="#e28a6a" opacity="0.55"/>
    <!-- nori belt across top -->
    <rect x="0" y="20" width="88" height="12" rx="2" fill="#2c2a26"/>
    <!-- furikake dots -->
    <g fill="#3d6b5a"><circle cx="28" cy="18" r="1.5"/><circle cx="42" cy="16" r="1.3"/><circle cx="56" cy="18" r="1.4"/></g>
  </g>
  <!-- musubi 2 (angled right) -->
  <g transform="translate(168,70) rotate(8)">
    <rect x="8" y="18" width="10" height="52" rx="2" fill="#2c2a26"/>
    <rect x="70" y="18" width="10" height="52" rx="2" fill="#2c2a26"/>
    <rect x="10" y="28" width="68" height="36" rx="4" fill="#faf6ef" stroke="#e4d9c8" stroke-width="1.5"/>
    <g fill="#e4d9c8" opacity="0.65">
      <circle cx="26" cy="42" r="1.3"/><circle cx="40" cy="38" r="1.2"/><circle cx="54" cy="44" r="1.3"/>
      <circle cx="34" cy="52" r="1.1"/><circle cx="50" cy="50" r="1.2"/>
    </g>
    <rect x="14" y="12" width="60" height="22" rx="3" fill="#d97858" stroke="#a84830" stroke-width="1.5"/>
    <rect x="18" y="16" width="52" height="5" rx="2" fill="#ef9a78" opacity="0.5"/>
    <rect x="0" y="20" width="88" height="12" rx="2" fill="#3a3834"/>
    <g fill="#c45c3e"><circle cx="30" cy="17" r="1.4"/><circle cx="46" cy="15" r="1.2"/><circle cx="60" cy="17" r="1.3"/></g>
  </g>
  <ellipse cx="160" cy="176" rx="90" ry="7" fill="#2c2a26" opacity="0.07"/>
</svg>
