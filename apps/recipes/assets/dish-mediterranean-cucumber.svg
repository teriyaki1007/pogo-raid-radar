<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mediterranean cucumber salad">
  <!-- giant cucumber rounds — green + white seed centers -->
  <circle cx="95" cy="100" r="62" fill="#3d6b5a"/>
  <circle cx="95" cy="100" r="40" fill="#e6f3ec"/>
  <circle cx="95" cy="100" r="14" fill="#8fc4a8"/>
  <circle cx="185" cy="70" r="55" fill="#5f9a7a"/>
  <circle cx="185" cy="70" r="35" fill="#dff0e7"/>
  <circle cx="185" cy="70" r="12" fill="#7db698"/>
  <circle cx="230" cy="130" r="58" fill="#78b294"/>
  <circle cx="230" cy="130" r="37" fill="#e8f5ee"/>
  <circle cx="230" cy="130" r="13" fill="#8fc4a8"/>
  <!-- bold white feta cubes -->
  <rect x="55" y="145" width="36" height="28" rx="4" fill="#fffaf3" stroke="#c9b79a" stroke-width="2.5"/>
  <rect x="125" y="150" width="32" height="26" rx="4" fill="#f7f1e8" stroke="#c9b79a" stroke-width="2.5"/>
  <rect x="165" y="125" width="30" height="24" rx="4" fill="#fffaf3" stroke="#c9b79a" stroke-width="2.5"/>
  <!-- red onion arcs -->
  <path d="M40 80 A40 40 0 0 1 95 45" fill="none" stroke="#c45c3e" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 145 A35 35 0 0 1 190 160" fill="none" stroke="#a84830" stroke-width="7" stroke-linecap="round"/>
  <!-- lime wedge — bright -->
  <path d="M270 40 L310 55 L285 95 Z" fill="#b8d4a8" stroke="#3d6b5a" stroke-width="2.5"/>
  <path d="M278 52 L298 60 L286 80 Z" fill="#e6f3ec" opacity="0.7"/>
  <!-- herb leaves -->
  <path d="M35 130 C28 105, 48 95, 55 120 C62 100, 78 110, 62 135Z" fill="#2a4f42"/>
</svg>
