<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Avocado sushi bake">
  <!-- rectangular baking dish — UNIQUE bake shape -->
  <rect x="25" y="40" width="270" height="130" rx="12" fill="#c9b79a" stroke="#a89878" stroke-width="4"/>
  <rect x="35" y="50" width="250" height="110" rx="8" fill="#faf6ef"/>
  <!-- rice layer -->
  <rect x="40" y="115" width="240" height="40" rx="4" fill="#f0e6d4"/>
  <g fill="#e4d9c8">
    <circle cx="60" cy="130" r="2.5"/><circle cx="90" cy="125" r="2"/><circle cx="120" cy="135" r="2.5"/>
    <circle cx="150" cy="128" r="2"/><circle cx="180" cy="138" r="2.5"/><circle cx="210" cy="130" r="2"/>
    <circle cx="240" cy="135" r="2.5"/><circle cx="75" cy="145" r="2"/><circle cx="200" cy="145" r="2"/>
  </g>
  <!-- salmon strips across top -->
  <rect x="45" y="55" width="70" height="28" rx="5" fill="#e28a6a" stroke="#c45c3e" stroke-width="2"/>
  <rect x="125" y="52" width="75" height="30" rx="5" fill="#d97858" stroke="#a84830" stroke-width="2"/>
  <rect x="210" y="55" width="65" height="28" rx="5" fill="#ef9a78" stroke="#c45c3e" stroke-width="2"/>
  <!-- avocado slices — green crescents -->
  <ellipse cx="80" cy="100" rx="35" ry="18" fill="#5f9a7a" stroke="#3d6b5a" stroke-width="2" transform="rotate(-8 80 100)"/>
  <ellipse cx="80" cy="100" rx="20" ry="8" fill="#c8e0c0" transform="rotate(-8 80 100)"/>
  <ellipse cx="160" cy="105" rx="38" ry="18" fill="#78b294" stroke="#3d6b5a" stroke-width="2" transform="rotate(5 160 105)"/>
  <ellipse cx="160" cy="105" rx="22" ry="8" fill="#dfeee6" transform="rotate(5 160 105)"/>
  <ellipse cx="240" cy="98" rx="34" ry="17" fill="#6fa888" stroke="#3d6b5a" stroke-width="2" transform="rotate(-5 240 98)"/>
  <ellipse cx="240" cy="98" rx="18" ry="7" fill="#c8e0c0" transform="rotate(-5 240 98)"/>
  <!-- nori strips -->
  <rect x="50" y="85" width="10" height="55" rx="2" fill="#2c2a26"/>
  <rect x="155" y="80" width="10" height="60" rx="2" fill="#1a1917"/>
  <rect x="255" y="85" width="10" height="55" rx="2" fill="#2c2a26"/>
  <!-- sesame seeds -->
  <g fill="#2c2a26">
    <ellipse cx="100" cy="75" rx="3" ry="1.5" transform="rotate(30 100 75)"/>
    <ellipse cx="190" cy="72" rx="3" ry="1.5" transform="rotate(-20 190 72)"/>
    <ellipse cx="130" cy="110" rx="2.5" ry="1.2"/>
    <ellipse cx="220" cy="115" rx="2.5" ry="1.2" transform="rotate(40 220 115)"/>
  </g>
  <g fill="#f7f1e8">
    <ellipse cx="110" cy="88" rx="3" ry="1.5" transform="rotate(-15 110 88)"/>
    <ellipse cx="200" cy="90" rx="3" ry="1.5" transform="rotate(25 200 90)"/>
  </g>
</svg>
