<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Tomato beef soup">
  <!-- deep round bowl — UNIQUE round deep silhouette -->
  <ellipse cx="160" cy="175" rx="115" ry="18" fill="#2c2a26" opacity="0.12"/>
  <path d="M45 70 C52 185, 268 185, 275 70" fill="#d8cbb8" stroke="#c9b79a" stroke-width="4"/>
  <path d="M55 70 C62 170, 258 170, 265 70" fill="#f0e6d8"/>
  <!-- deep red broth surface — fills most of view -->
  <ellipse cx="160" cy="72" rx="112" ry="42" fill="#8a3a28"/>
  <ellipse cx="160" cy="68" rx="105" ry="36" fill="#c45c3e"/>
  <ellipse cx="160" cy="64" rx="95" ry="28" fill="#d97858"/>
  <ellipse cx="130" cy="55" rx="40" ry="12" fill="#e28a6a" opacity="0.55"/>
  <!-- tomato wedges -->
  <path d="M75 75 L105 45 L120 90 Z" fill="#a84830" stroke="#6b2818" stroke-width="2"/>
  <path d="M210 55 L245 40 L255 85 Z" fill="#c45c3e" stroke="#6b2818" stroke-width="2"/>
  <!-- beef chunks -->
  <rect x="105" y="85" width="42" height="28" rx="6" fill="#5c3220" stroke="#3a2010" stroke-width="2" transform="rotate(-12 126 99)"/>
  <rect x="155" y="95" width="38" height="24" rx="6" fill="#6b3a28" stroke="#3a2010" stroke-width="2" transform="rotate(8 174 107)"/>
  <rect x="190" y="80" width="36" height="26" rx="6" fill="#4a2818" stroke="#3a2010" stroke-width="2"/>
  <!-- cabbage shreds -->
  <path d="M90 58 Q130 45 160 62" fill="none" stroke="#e6f3ec" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 50 Q210 40 245 60" fill="none" stroke="#dfeee6" stroke-width="4" stroke-linecap="round"/>
  <!-- steam -->
  <path d="M120 35 Q128 18 118 5" fill="none" stroke="#c9b79a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 28 Q170 10 158 0" fill="none" stroke="#c9b79a" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M200 35 Q210 18 198 5" fill="none" stroke="#c9b79a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
