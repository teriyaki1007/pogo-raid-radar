<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Crispy edamame cucumber salad">
  <!-- avocado halves — large green ovals -->
  <ellipse cx="95" cy="105" rx="70" ry="55" fill="#5f9a7a" stroke="#3d6b5a" stroke-width="3" transform="rotate(-20 95 105)"/>
  <ellipse cx="95" cy="105" rx="42" ry="32" fill="#c8e0c0" transform="rotate(-20 95 105)"/>
  <ellipse cx="95" cy="105" rx="14" ry="18" fill="#8a6a3a" transform="rotate(-20 95 105)"/>
  <ellipse cx="175" cy="130" rx="58" ry="42" fill="#78b294" stroke="#3d6b5a" stroke-width="3" transform="rotate(15 175 130)"/>
  <ellipse cx="175" cy="130" rx="34" ry="24" fill="#dfeee6" transform="rotate(15 175 130)"/>
  <!-- edamame pods — dark green with bright beans -->
  <ellipse cx="230" cy="55" rx="55" ry="28" fill="#2a4f42" transform="rotate(-30 230 55)"/>
  <circle cx="205" cy="48" r="12" fill="#a8d4b0"/>
  <circle cx="230" cy="58" r="13" fill="#b8dcb8"/>
  <circle cx="255" cy="52" r="11" fill="#9ecca8"/>
  <ellipse cx="260" cy="115" rx="48" ry="24" fill="#3d6b5a" transform="rotate(18 260 115)"/>
  <circle cx="240" cy="110" r="11" fill="#b8dcb8"/>
  <circle cx="265" cy="120" r="12" fill="#a8d4b0"/>
  <circle cx="285" cy="112" r="10" fill="#9ecca8"/>
  <!-- loose beans -->
  <circle cx="145" cy="55" r="14" fill="#6fa888" stroke="#3d6b5a" stroke-width="2"/>
  <circle cx="50" cy="160" r="12" fill="#78b294" stroke="#3d6b5a" stroke-width="2"/>
  <circle cx="200" cy="175" r="11" fill="#5f9a7a" stroke="#3d6b5a" stroke-width="2"/>
  <!-- cucumber ribbon strip -->
  <path d="M30 40 C80 20, 130 25, 160 55" fill="none" stroke="#6fa888" stroke-width="14" stroke-linecap="round"/>
  <path d="M30 40 C80 20, 130 25, 160 55" fill="none" stroke="#3d6b5a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
