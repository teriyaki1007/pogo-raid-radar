<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Carbonara pasta plating">
  <rect width="320" height="200" rx="24" fill="#f7f1e8"/>
  <!-- shallow pasta plate -->
  <ellipse cx="160" cy="116" rx="120" ry="58" fill="#fffaf3" stroke="#e4d9c8" stroke-width="3"/>
  <ellipse cx="160" cy="110" rx="104" ry="46" fill="#faf6ef"/>
  <!-- twirled spaghetti nest -->
  <path d="M100 100 C120 70, 160 68, 190 95 C165 82, 130 82, 100 100Z" fill="none" stroke="#e8dcc8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 112 C130 88, 170 86, 200 110 C172 98, 140 98, 110 112Z" fill="none" stroke="#f0e6d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M118 124 C140 104, 175 102, 205 122 C178 112, 150 112, 118 124Z" fill="none" stroke="#e4d9c8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M128 96 C148 78, 178 80, 198 100" fill="none" stroke="#dccfb8" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 118 C125 130, 165 132, 195 118" fill="none" stroke="#e8dcc8" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="155" cy="108" rx="28" ry="16" fill="#f3ebe0" opacity="0.7"/>
  <!-- creamy yolk gloss -->
  <ellipse cx="152" cy="106" rx="18" ry="10" fill="#e28a6a" opacity="0.35"/>
  <!-- guanciale / pancetta cubes -->
  <rect x="130" y="98" width="14" height="10" rx="2" fill="#c45c3e" stroke="#a84830" stroke-width="1" transform="rotate(-15 137 103)"/>
  <rect x="160" y="112" width="13" height="9" rx="2" fill="#d97858" stroke="#a84830" stroke-width="1" transform="rotate(10 166 116)"/>
  <rect x="175" y="94" width="12" height="9" rx="2" fill="#a84830" stroke="#8a3a28" stroke-width="1"/>
  <rect x="145" y="120" width="11" height="8" rx="2" fill="#c45c3e" stroke="#a84830" stroke-width="1" transform="rotate(-5 150 124)"/>
  <!-- pecorino dust -->
  <g fill="#f7f1e8" stroke="#c9b79a" stroke-width="0.6">
    <circle cx="120" cy="108" r="2"/><circle cx="188" cy="116" r="1.8"/><circle cx="168" cy="88" r="1.6"/>
    <circle cx="138" cy="130" r="1.7"/><circle cx="200" cy="100" r="1.5"/>
  </g>
  <!-- cracked black pepper -->
  <g fill="#2c2a26" opacity="0.75">
    <circle cx="142" cy="100" r="1.4"/><circle cx="158" cy="118" r="1.2"/><circle cx="172" cy="104" r="1.3"/>
    <circle cx="126" cy="122" r="1.1"/><circle cx="184" cy="126" r="1.2"/><circle cx="150" cy="90" r="1"/>
    <circle cx="196" cy="108" r="1.1"/><circle cx="134" cy="112" r="0.9"/>
  </g>
  <!-- fork hint resting on rim -->
  <line x1="230" y1="70" x2="250" y2="140" stroke="#c9b79a" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="78" x2="248" y2="72" stroke="#c9b79a" stroke-width="2" stroke-linecap="round"/>
  <line x1="246" y1="82" x2="254" y2="78" stroke="#c9b79a" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="160" cy="178" rx="82" ry="7" fill="#2c2a26" opacity="0.07"/>
</svg>
