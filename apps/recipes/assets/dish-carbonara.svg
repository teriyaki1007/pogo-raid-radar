<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Carbonara">
  <!-- yellow pasta nest — dominant warm yellow story -->
  <ellipse cx="160" cy="110" rx="130" ry="70" fill="#e8d090"/>
  <ellipse cx="160" cy="105" rx="115" ry="58" fill="#f0e0a0"/>
  <!-- spaghetti coils -->
  <path d="M55 100 C100 40, 180 35, 240 95" fill="none" stroke="#d4b860" stroke-width="10" stroke-linecap="round"/>
  <path d="M65 120 C115 55, 195 50, 255 115" fill="none" stroke="#e8d090" stroke-width="12" stroke-linecap="round"/>
  <path d="M75 140 C125 85, 200 80, 260 135" fill="none" stroke="#c9a848" stroke-width="10" stroke-linecap="round"/>
  <path d="M90 80 C135 50, 185 52, 225 88" fill="none" stroke="#f3e8b0" stroke-width="9" stroke-linecap="round"/>
  <path d="M70 130 C120 155, 190 158, 245 128" fill="none" stroke="#dcc878" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="155" cy="108" rx="45" ry="28" fill="#f7f1e8" opacity="0.55"/>
  <!-- creamy yolk gloss -->
  <ellipse cx="150" cy="105" rx="30" ry="18" fill="#e28a6a" opacity="0.4"/>
  <!-- guanciale bits — bold pink-brown cubes -->
  <rect x="110" y="75" width="28" height="20" rx="4" fill="#c45c3e" stroke="#8a3a28" stroke-width="2" transform="rotate(-18 124 85)"/>
  <rect x="165" y="95" width="26" height="18" rx="4" fill="#d97858" stroke="#8a3a28" stroke-width="2" transform="rotate(12 178 104)"/>
  <rect x="190" y="70" width="24" height="18" rx="4" fill="#a84830" stroke="#6b2818" stroke-width="2"/>
  <rect x="130" y="125" width="22" height="16" rx="4" fill="#c45c3e" stroke="#8a3a28" stroke-width="2" transform="rotate(-8 141 133)"/>
  <rect x="175" y="130" width="20" height="15" rx="3" fill="#d97858" stroke="#8a3a28" stroke-width="2" transform="rotate(15 185 137)"/>
  <!-- speckled black pepper — unmistakable -->
  <g fill="#2c2a26">
    <circle cx="100" cy="95" r="3.5"/><circle cx="145" cy="85" r="3"/><circle cx="180" cy="110" r="3.5"/>
    <circle cx="120" cy="120" r="2.8"/><circle cx="210" cy="95" r="3"/><circle cx="155" cy="135" r="2.5"/>
    <circle cx="85" cy="125" r="2.5"/><circle cx="230" cy="120" r="3"/><circle cx="165" cy="70" r="2.8"/>
    <circle cx="135" cy="105" r="2"/><circle cx="200" cy="140" r="2.5"/><circle cx="110" cy="145" r="2"/>
  </g>
</svg>
