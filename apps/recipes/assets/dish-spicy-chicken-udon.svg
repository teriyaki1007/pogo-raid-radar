<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Spicy chicken udon">
  <!-- orange-red chili oil pool as dominant background shape -->
  <ellipse cx="160" cy="110" rx="140" ry="75" fill="#c45c3e"/>
  <ellipse cx="160" cy="105" rx="125" ry="62" fill="#d97858"/>
  <ellipse cx="140" cy="90" rx="50" ry="20" fill="#e28a6a" opacity="0.5"/>
  <!-- thick udon noodle coils — cream against red -->
  <path d="M50 90 C90 40, 150 35, 190 85" fill="none" stroke="#f7f1e8" stroke-width="16" stroke-linecap="round"/>
  <path d="M60 115 C110 60, 180 55, 230 110" fill="none" stroke="#f0e6d4" stroke-width="18" stroke-linecap="round"/>
  <path d="M80 140 C130 95, 195 92, 250 135" fill="none" stroke="#e8dcc8" stroke-width="15" stroke-linecap="round"/>
  <path d="M100 70 C145 45, 200 50, 245 85" fill="none" stroke="#faf6ef" stroke-width="14" stroke-linecap="round"/>
  <path d="M55 130 C100 155, 180 158, 240 125" fill="none" stroke="#e4d9c8" stroke-width="13" stroke-linecap="round"/>
  <!-- soft egg halves -->
  <ellipse cx="70" cy="155" rx="32" ry="24" fill="#f7f1e8" stroke="#e4d9c8" stroke-width="2"/>
  <ellipse cx="70" cy="155" rx="16" ry="14" fill="#e28a6a"/>
  <ellipse cx="260" cy="150" rx="28" ry="22" fill="#faf6ef" stroke="#e4d9c8" stroke-width="2"/>
  <ellipse cx="260" cy="150" rx="14" ry="12" fill="#d97858"/>
  <!-- chili oil droplets + sesame -->
  <circle cx="150" cy="160" r="6" fill="#a84830"/>
  <circle cx="175" cy="168" r="5" fill="#8a3a28"/>
  <circle cx="195" cy="155" r="5.5" fill="#a84830"/>
  <g fill="#2c2a26">
    <circle cx="130" cy="75" r="2.5"/><circle cx="160" cy="60" r="2"/><circle cx="190" cy="70" r="2.5"/>
    <circle cx="210" cy="95" r="2"/><circle cx="100" cy="100" r="2"/>
  </g>
</svg>
