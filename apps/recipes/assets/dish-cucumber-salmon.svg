<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Cucumber salmon roll salad">
  <!-- no full-bleed cream bg — transparent -->
  <!-- bold cucumber ribbon waves filling frame -->
  <path d="M20 70 C70 20, 140 25, 190 75 C150 45, 90 48, 20 70Z" fill="#3d6b5a"/>
  <path d="M28 95 C85 40, 165 38, 230 95 C175 58, 110 60, 28 95Z" fill="#5f9a7a"/>
  <path d="M35 120 C100 60, 185 58, 255 118 C195 78, 125 80, 35 120Z" fill="#78b294"/>
  <path d="M48 145 C115 95, 200 92, 275 140 C210 108, 140 110, 48 145Z" fill="#6fa888"/>
  <!-- coral salmon cubes — large, unmistakable -->
  <rect x="195" y="48" width="52" height="40" rx="8" fill="#e28a6a" stroke="#c45c3e" stroke-width="2.5" transform="rotate(-12 221 68)"/>
  <rect x="235" y="78" width="48" height="36" rx="8" fill="#d97858" stroke="#a84830" stroke-width="2.5" transform="rotate(8 259 96)"/>
  <rect x="200" y="105" width="46" height="34" rx="8" fill="#ef9a78" stroke="#c45c3e" stroke-width="2.5" transform="rotate(-4 223 122)"/>
  <rect x="245" y="125" width="42" height="32" rx="7" fill="#e28a6a" stroke="#a84830" stroke-width="2.5"/>
  <!-- sauce dots -->
  <circle cx="70" cy="155" r="14" fill="#f3ebe0" stroke="#c9b79a" stroke-width="2"/>
  <circle cx="105" cy="165" r="10" fill="#c45c3e"/>
  <!-- herb flecks -->
  <ellipse cx="160" cy="55" rx="8" ry="3.5" fill="#2a4f42" transform="rotate(-25 160 55)"/>
  <ellipse cx="130" cy="160" rx="7" ry="3" fill="#3d6b5a" transform="rotate(20 130 160)"/>
</svg>
