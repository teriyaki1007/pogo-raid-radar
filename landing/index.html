<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1020" />
    <title>Apps</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --card: #141c2e;
        --text: #e8eefc;
        --muted: #9aa8c7;
        --accent: #f5c542;
        --border: #24304a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2744 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(28rem, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      .apps {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a.app {
        display: block;
        text-decoration: none;
        color: var(--text);
        background: #0f1628;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.95rem 1rem;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      a.app:hover,
      a.app:focus-visible {
        border-color: var(--accent);
        outline: none;
        transform: translateY(-1px);
      }
      a.app strong {
        display: block;
        color: var(--accent);
        font-size: 1.05rem;
        margin-bottom: 0.2rem;
      }
      a.app span {
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <p>Multi-app host. Pick an app below.</p>
      <div class="apps">
        <a class="app" href="/raid/">
          <strong>Raid Radar</strong>
          <span>Pokémon GO raids, eggs Pokémon GO raid schedule Team GO Rocket</span>
        </a>
        <a class="app" href="/lantern-courts/">
          <strong>Lantern Courts Dex</strong>
          <span>Aftermyth · Series 1 card/creature browser</span>
        </a>
        <a class="app" href="/ap-csa/">
          <strong>AP CSA Study Plan</strong>
          <span>Weekly Java study checklists through the May 12, 2027 exam</span>
        </a>
      </div>
    </main>
  </body>
</html>
